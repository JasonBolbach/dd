; dd hardware demo: Raspberry Pi Pico W / Pico 2 W + 320x240 SPI LCD (TE004) + rotary encoder + 2 buttons.
; Display class: include/LGFX_User_TE004.h   Pins: include/Pins.h   Options: top of src/main.cpp.
;   pio run -e picow -t upload       (Pico W)        pio run -e pico2w -t upload      (Pico 2 W)

[env:picow]                  ; Raspberry Pi Pico W (RP2040, 264 KB RAM)
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
monitor_speed = 115200
build_flags =
    ; demo options (see src/DemoScene.h and the top of src/main.cpp). Pico W: an 8-bit off-screen buffer (77 KB instead of 154 KB),
    ; a modest particle count and arena cap; there is no touch, so no on-screen buttons.
    -DDEMO_SPRITE_DEPTH=8
    -DDEMO_PARTICLES=40
    -DDEMO_ARENA_BYTES=49152
    -DDEMO_BUTTONS=0
lib_deps =
    lovyan03/LovyanGFX@^1.2.21
    ; SuperGUI (SuperEncoder, SuperButton): the checkout next to this repository (three folders up). To build a copy of this folder on its own,
    ; replace the next line with  https://github.com/JasonBolbach/SuperGUI.git
    symlink://../../../SuperGUI
    ; dd itself: this repository (two folders up) when built from the repo checkout. To build a copy of this folder on its own,
    ; replace the next line with  https://github.com/JasonBolbach/dd.git
    symlink://../..

[env:pico2w]                 ; Raspberry Pi Pico 2 W (RP2350, 520 KB RAM): same project, 16-bit buffer, more particles
extends = env:picow
board = rpipico2w
build_flags =
    -DDEMO_SPRITE_DEPTH=16
    -DDEMO_PARTICLES=150
    -DDEMO_ARENA_BYTES=131072
    -DDEMO_BUTTONS=0
